services:
  - type: web
    name: momo-delights
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: momo_delights
      - key: ADMIN_EMAIL
        sync: false
